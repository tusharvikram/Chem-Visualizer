<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <linearGradient id="mol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Bonds drawn first so the atom circles cover their ends. The two bonds sit
       at 100 degrees to each other, close to water's real 104.5 degrees. -->
  <g stroke="url(#mol)" stroke-width="6.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="13" y2="48"/>
    <line x1="32" y1="32" x2="51" y2="48"/>
  </g>
  <circle cx="13" cy="48" r="7.5" fill="url(#mol)"/>
  <circle cx="51" cy="48" r="7.5" fill="url(#mol)"/>
  <circle cx="32" cy="32" r="13" fill="url(#mol)"/>
  <!-- Lone pairs, enlarged relative to the reference so they survive at 16px -->
  <circle cx="25.2" cy="12.5" r="4.1" fill="#ec4899"/>
  <circle cx="38.8" cy="12.5" r="4.1" fill="#ec4899"/>
</svg>
